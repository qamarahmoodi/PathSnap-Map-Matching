# Default PathSnap Candidate Generation & Route Alignment Configuration

dataset:
  default_relative_root: "../Student folder"
  env_var: "PATHSNAP_DATA_ROOT"
  partitions:
    train: "train"
    student_test: "student_test"

candidate_generation:
  search_radius_m: 100.0
  max_candidates_k: 10
  enable_fallback_nearest: true
  fallback_max_radius_m: 500.0

feature_engineering:
  min_displacement_for_bearing_m: 2.5
  max_valid_delta_time_s: 30.0
  max_plausible_speed_mps: 65.0

route_alignment:
  alignment_emission_sigma_m: 15.0
  alignment_bearing_weight: 5.0
  alignment_skip_penalty_per_arc: 1.5
  alignment_length_mismatch_weight: 0.25
  alignment_max_confident_distance_m: 50.0
  alignment_max_unmatched_distance_m: 120.0
  alignment_ambiguity_margin_m: 3.0

viterbi_decoder:
  prob_floor: 1.0e-6
  emission_weight: 1.0
  normalize_emissions_within_obs: false
  same_arc_log_prob: -0.15
  direct_successor_log_prob: -0.60
  two_hop_log_prob: -2.20
  three_hop_log_prob: -3.80
  disconnected_log_prob: -10.50
  reverse_arc_penalty: -4.00
  length_mismatch_penalty_per_m: 0.015
  large_gap_threshold_s: 10.0
  reset_gap_threshold_s: 60.0
  max_hops: 3

inference:
  default_model_path: "artifacts/best_model.joblib"
  fallback_model_path: "artifacts/phase1_pilot_tuned_hgb.joblib"
  env_model_path: "PATHSNAP_MODEL_PATH"

api:
  host: "0.0.0.0"
  port: 8000
  default_eval_partition: "student_test"
  evaluator_partition_name: "evaluator_test"
  allow_cors_origins:
    - "*"
